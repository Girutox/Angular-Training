<section id="tasks">
  <header>
    <h2>{{selectedUser.name}}'s Tasks</h2>
    <menu>
      <button (click)="onAddTask()">Add Task</button>
    </menu>
  </header>
  <ul>
    @for (task of selectedUserTasks; track task.id) {
      <li>
        <app-task [task]="task" />
      </li>
    }
  </ul>
</section>

@if (showAddTaskComponent()) {
  <app-new-task (dismiss)="onDismiss()" [userId]="selectedUser.id"/>
}
